<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3880ff"/>
      <stop offset="100%" style="stop-color:#5260ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Book/notebook icon -->
  <g transform="translate(200, 180) scale(0.6)">
    <rect x="150" y="50" width="700" height="900" rx="40" fill="#ffffff" opacity="0.95"/>
    <rect x="150" y="50" width="80" height="900" rx="10" fill="#e0e0ff"/>
    <line x1="300" y1="200" x2="750" y2="200" stroke="#3880ff" stroke-width="8" opacity="0.4"/>
    <line x1="300" y1="320" x2="750" y2="320" stroke="#3880ff" stroke-width="8" opacity="0.4"/>
    <line x1="300" y1="440" x2="750" y2="440" stroke="#3880ff" stroke-width="8" opacity="0.4"/>
    <line x1="300" y1="560" x2="750" y2="560" stroke="#3880ff" stroke-width="8" opacity="0.4"/>
    <line x1="300" y1="680" x2="750" y2="680" stroke="#3880ff" stroke-width="8" opacity="0.4"/>
    <!-- Checkmark -->
    <g transform="translate(350, 250)">
      <text font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="#3880ff">A+</text>
    </g>
  </g>
</svg>
